{% set name = "findlibs" %}
{% set pypi_name = "findlibs" %}
{% set version = "0.1.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ pypi_name[0] }}/{{ pypi_name }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: 68bc98d26cbd73ea2a20ee11920f60d8ad29c504e2ce82191aafd8ef734cb865

build:
  number: 0
  noarch: python
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed -vv '

requirements:
  host:
    - pip
    - python >=3.6
    - setuptools >=61
    - setuptools-scm >=8
  run:
    - python >=3.6

test:
  commands:
    - test -f $(python -c "import site; print(site.getsitepackages()[0])")/findlibs/__init__.py  # [not win]

about:
  home: https://github.com/ecmwf/findlibs
  license: Apache-2.0
  license_family: Apache
  license_file:
    - LICENSE
  summary: Python package to search for shared libraries on various platforms

extra:
  recipe-maintainers:
    - iainrussell
